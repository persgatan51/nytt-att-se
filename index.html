<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Nytt att se</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--fg:#eef0f4;--mut:#9aa3b2;--acc:#e5b84b;--line:#2a2f3a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.95);backdrop-filter:blur(8px);padding:12px 14px 8px;border-bottom:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:8px}
  h1{font-size:20px;margin:0;flex:1}
  button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
  button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
  .chips button{white-space:nowrap}
  main{padding:4px 14px 40px}
  h3{font-size:14px;color:var(--mut);margin:18px 0 8px;font-weight:600;text-transform:capitalize}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
  .item{background:none;border:0;border-radius:10px;padding:0;text-align:left}
  .item img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:var(--card);display:block}
  .ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;padding:6px;text-align:center}
  .t{font-size:13px;margin-top:5px;font-weight:600;line-height:1.25}
  .m{font-size:11px;color:var(--mut)}
  .badges{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
  .b{font-size:10px;padding:1px 6px;border-radius:6px;font-weight:700}
  .b.netflix{background:#e50914;color:#fff}.b.prime{background:#00a8e1;color:#001}.b.hbo{background:#7b2cff;color:#fff}
  .b.apple{background:#f2f2f2;color:#111}.b.skyshowtime{background:#1f2f8f;color:#fff}.b.viaplay{background:#e4003a;color:#fff}.b.disney{background:#0b3fa8;color:#fff}
  .actions a.apple{background:#f2f2f2;border-color:#f2f2f2;color:#111}
  .actions a.skyshowtime{background:#1f2f8f;border-color:#1f2f8f}
  .actions a.disney{background:#0b3fa8;border-color:#0b3fa8}
  .actions a.viaplay{background:#e4003a;border-color:#e4003a}
  .msg{color:var(--mut);text-align:center;padding:30px 10px}
  .more{display:block;margin:20px auto 0}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
  .sheet.open{display:flex}
  .panel{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;border-top:1px solid var(--line);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .hero{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--card)}
  .pad{padding:14px}
  .pad h2{margin:0 0 4px;font-size:20px}
  .actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .actions a{display:block;text-align:center;padding:12px;border-radius:12px;text-decoration:none;color:#fff;font-weight:600;background:var(--card);border:1px solid var(--line)}
  .actions a.tv{background:#1b7f4b;border-color:#1b7f4b}
  #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
         background:#2a2f3a;color:var(--fg);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:50;
         max-width:90vw;text-align:center;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .actions a.trailer{background:#2a2f3a;border-color:#3a4150}
  #people{margin-top:8px;line-height:1.5}
  #people b{color:var(--fg);font-weight:600}
  .actions a.primary{background:var(--acc);color:#111;border-color:var(--acc)}
  .actions a.netflix{background:#e50914;border-color:#e50914}
  .actions a.prime{background:#00a8e1;border-color:#00a8e1;color:#001}
  .actions a.hbo{background:#7b2cff;border-color:#7b2cff}
  .tip{font-size:12px;color:var(--mut);margin-top:10px}
  input,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
  label{display:block;margin:12px 0 6px;color:var(--mut);font-size:13px}
  label.chk{display:flex;align-items:center;gap:10px;margin:8px 0;color:var(--fg);font-size:15px}
  label.chk input{width:20px;height:20px;accent-color:var(--acc)}
  a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Nytt att se</h1>
    <button id="btnRefresh" aria-label="Uppdatera">↻</button>
    <button id="btnSettings" aria-label="Inställningar">⚙︎</button>
  </div>
  <div class="chips" id="typeChips">
    <button data-type="all" class="on">Alla</button>
    <button data-type="movie">Filmer</button>
    <button data-type="series">Serier</button>
    <button id="btnYear"></button>
    <button id="btnHidden">Visa dolda</button>
  </div>
</header>

<main>
  <div id="status" class="msg">Laddar…</div>
  <div id="list"></div>
  <button id="btnMore" class="more" style="display:none">Visa äldre</button>
  <p class="tip" id="filterNote" style="text-align:center"></p>
  <p class="tip" id="usage" style="text-align:center"></p>
</main>

<div class="sheet" id="detail"><div class="panel" id="detailBody"></div></div>

<div class="sheet" id="settings"><div class="panel"><div class="pad">
  <h2>Inställningar</h2>
  <div id="tvSection"></div>
  <label for="source">Datakälla</label>
  <select id="source">
    <option value="rapid">RapidAPI – datum när titeln lades upp + direktlänkar</option>
    <option value="tmdb">Bara TMDB – premiärdatum, inga RapidAPI-anrop</option>
  </select>
  <label for="saKey">Streaming Availability API-nyckel (krävs för RapidAPI)</label>
  <input id="saKey" autocomplete="off" spellcheck="false" placeholder="Klistra in nyckeln här">
  <label for="saSource">Var kommer nyckeln ifrån?</label>
  <select id="saSource">
    <option value="rapid">RapidAPI (rapidapi.com)</option>
    <option value="motn">Movie of the Night (developers.movieofthenight.com)</option>
  </select>
  <p class="tip">Gratisnivån räcker gott för privat bruk. Appen sparar svaren i några timmar för att spara anrop.</p>
  <label for="tmdbKey">TMDB-nyckel (krävs för "Bara TMDB", Viaplay, landfilter och svenska beskrivningar)</label>
  <input id="tmdbKey" autocomplete="off" spellcheck="false" placeholder="v3-nyckel eller Read Access Token">
  <p class="tip">Nycklarna sparas bara i den här webbläsaren.</p>
  <label>Mina streamingtjänster</label>
  <div id="serviceBoxes"></div>
  <label for="minYear">Visa bara titlar utgivna från och med år (slås av/på med knappen i listan)</label>
  <input id="minYear" type="number" min="1900" max="2100">
  <label>Dölj filmer och serier från</label>
  <div id="regionBoxes"></div>
  <p class="tip">Bedöms på originalspråk och ursprungsland från TMDB (kräver TMDB-nyckeln).</p>
  <div class="actions">
    <a href="#" class="primary" id="saveSettings">Spara</a>
    <a href="#" id="closeSettings">Stäng</a>
  </div>
</div></div></div>

<script>
const COUNTRY = "se";
// src "sa"   = Streaming Availability (datum för när titeln lades upp + direktlänk)
// src "tmdb" = TMDB (bara premiärdatum + länk till TMDB:s "var kan jag se"-sida)
const SERVICES = [
  { key:"netflix",     label:"Netflix",     src:"sa", match:/^netflix$/i },
  { key:"prime",       label:"Prime Video", src:"sa", match:/^amazon prime video$/i },
  { key:"hbo",         label:"HBO Max",     src:"sa", match:/^(hbo max|max)$/i },
  { key:"apple",       label:"Apple TV",    src:"sa", match:/^apple tv( plus|\+)?$/i },
  { key:"disney",      label:"Disney+",     src:"sa", match:/^disney( plus|\+)$/i },
  { key:"skyshowtime", label:"SkyShowtime", src:"sa", match:/^skyshowtime$/i },
  { key:"viaplay",     label:"Viaplay",     src:"tmdb", match:/^viaplay$/i },
];
const SA_SERVICES = SERVICES.filter(s=>s.src==="sa");
const mine = () => SERVICES.filter(s=>cfg.services.includes(s.key));
const mySa = () => mine().filter(s=>s.src==="sa");
const CACHE_HOURS = 6, PAGES_PER_LOAD = 5, TMDB_PAGES = 3;

// Regioner som kan filtreras bort. En titel räknas till regionen om originalspråket
// hör dit, eller om alla ursprungsländer ligger där.
const REGIONS = [
  { key:"southasia", label:"Indien och Sydasien",
    countries:["IN","PK","BD","LK","NP","BT","MV","AF"],
    langs:["hi","ta","te","ml","kn","bn","mr","pa","gu","ur","or","as","si","ne"] },
  { key:"eastasia", label:"Östasien (Kina, Japan, Korea m.fl.)",
    countries:["CN","HK","TW","MO","JP","KR","KP","MN"],
    langs:["zh","cn","ja","ko","mn"] },
  { key:"seasia", label:"Sydostasien (Thailand, Filippinerna m.fl.)",
    countries:["TH","VN","PH","ID","MY","SG","KH","MM","LA","BN","TL"],
    langs:["th","vi","tl","id","ms","km","my","lo"] },
];

// ---------- lagring ----------
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch{ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
};
const oldCfg = store.get("cfg",{});
let cfg = Object.assign({ saKey:"", saSource:"rapid", tmdbKey: oldCfg.key || "",
                          exclude:["southasia","eastasia","seasia"],
                          minYear:2026, yearOn:true, source:"rapid",
                          services:SERVICES.map(s=>s.key) }, store.get("cfg2",{}));
let hidden = new Set(store.get("hidden",[]));
let meta = store.get("meta",{});   // tmdbId -> { lang, countries, sv }  (sparas permanent)
let state = { type:"all", svc:new Set(cfg.services), showHidden:false,
              shows:new Map(), cursor:null, hasMore:false };

// ---------- Streaming Availability API ----------
function countCall(){
  const today = new Date().toISOString().slice(0,10);
  const u = store.get("usage",{ day:today, n:0 });
  if (u.day !== today){ u.day = today; u.n = 0; }
  u.n++; store.set("usage",u);
}
function showUsage(){
  const u = store.get("usage",null), today = new Date().toISOString().slice(0,10);
  const n = u && u.day===today ? u.n : 0;
  document.getElementById("usage").textContent = cfg.source==="tmdb"
    ? `Källa: bara TMDB · ${n} RapidAPI-anrop idag`
    : `Källa: RapidAPI · ${n} anrop idag`;
}

async function sa(path, params){
  const rapid = cfg.saSource !== "motn";
  const url = new URL((rapid ? "https://streaming-availability.p.rapidapi.com" : "https://api.movieofthenight.com/v4") + path);
  for (const [a,b] of Object.entries(params)) if (b!=null) url.searchParams.set(a,b);
  const headers = rapid
    ? { "X-RapidAPI-Key":cfg.saKey, "X-RapidAPI-Host":"streaming-availability.p.rapidapi.com" }
    : { "X-API-Key":cfg.saKey };
  countCall();
  const r = await fetch(url, { headers });
  if (r.status===401 || r.status===403) throw new Error("Nyckeln godtogs inte. Kontrollera nyckel och källa under ⚙︎.");
  if (r.status===429) throw new Error("Dagens gratisanrop är slut. Försök igen i morgon.");
  if (!r.ok) throw new Error("Streaming Availability svarade "+r.status);
  return r.json();
}

async function fetchPage(cursor){
  return sa("/changes", {
    country: COUNTRY,
    catalogs: mySa().map(s=>s.key+".subscription").join(","),
    change_type: "new",
    item_type: "show",
    order_direction: "desc",
    cursor
  });
}

function ingest(res){
  for (const c of res.changes || []){
    const show = res.shows?.[c.showId]; if (!show) continue;
    const svc = c.service?.id; if (!SA_SERVICES.some(s=>s.key===svc)) continue;
    const it = state.shows.get(c.showId) || { show, added:{}, links:{} };
    it.show = show;
    if (c.timestamp && (!it.added[svc] || c.timestamp > it.added[svc])) it.added[svc] = c.timestamp;
    const opt = (show.streamingOptions?.[COUNTRY] || []).find(o=>o.service?.id===svc && o.type!=="rent" && o.type!=="buy");
    it.links[svc] = opt?.videoLink || opt?.link || c.link || it.links[svc];
    state.shows.set(c.showId, it);
  }
  state.cursor = res.nextCursor || null;
  state.hasMore = !!res.hasMore;
}

const feedKey = () => ["feed4", cfg.source, cfg.services.join(","),
  cfg.source==="tmdb" ? (cfg.yearOn ? cfg.minYear : "ar") : ""].join("|");
function saveCache(){
  store.set(feedKey(),{ t:Date.now(), cursor:state.cursor, hasMore:state.hasMore,
                     items:[...state.shows.entries()] });
}

async function load(force=false, more=false){
  const status = document.getElementById("status");
  const tmdbOnly = cfg.source==="tmdb";
  if (tmdbOnly ? !cfg.tmdbKey : !cfg.saKey){
    status.innerHTML = `Lägg in din ${tmdbOnly?"TMDB":"Streaming Availability"}-nyckel under <b>⚙︎</b> för att komma igång.`;
    status.style.display=""; showUsage(); return;
  }
  if (!force && !more){
    const c = store.get(feedKey(),null);
    if (c && Date.now()-c.t < CACHE_HOURS*36e5){
      state.shows = new Map(c.items); state.cursor = c.cursor; state.hasMore = c.hasMore;
      await enrich(); render(); return;
    }
  }
  if (!more){ state.shows = new Map(); state.cursor = null; }
  status.textContent = "Hämtar nyheter…"; status.style.display="";
  try{
    if (tmdbOnly){
      await loadTmdbServices(mine());
      state.hasMore = false;
    } else if (mySa().length) {
      for (let i=0; i<PAGES_PER_LOAD; i++){
        ingest(await fetchPage(state.cursor));
        if (!state.hasMore) break;
      }
      if (!more && cfg.tmdbKey){
        status.textContent = "Hämtar Viaplay…";
        try{ await loadTmdbServices(mine().filter(s=>s.src==="tmdb")); }catch(e){ console.warn("Viaplay:", e); }
      }
    } else if (cfg.tmdbKey) {
      await loadTmdbServices(mine().filter(s=>s.src==="tmdb"));
      state.hasMore = false;
    }
    saveCache();
    status.textContent = "Kollar ursprungsland…";
    await enrich(); render();
  }catch(e){ status.textContent = e.message; status.style.display=""; }
  showUsage();
}

// ---------- TMDB-baserade tjänster (Viaplay) ----------
async function tmdbGet(path, params={}){
  const url = new URL("https://api.themoviedb.org/3"+path);
  const headers = { accept:"application/json" }, k = cfg.tmdbKey.trim();
  if (k.length > 40) headers.Authorization = "Bearer "+k; else url.searchParams.set("api_key",k);
  for (const [a,b] of Object.entries(params)) url.searchParams.set(a,b);
  const r = await fetch(url,{ headers });
  if (!r.ok) throw new Error("TMDB "+r.status);
  return r.json();
}

async function loadTmdbServices(services){
  // Fönster: från 1 jan årsfiltrets år (om på), annars ett år bakåt. TMDB har ingen dygnsgräns,
  // så vi hämtar flera sidor per tjänst – parallellt för att det ska gå fort.
  const iso = d=>d.toISOString().slice(0,10), today = iso(new Date());
  const from = cfg.yearOn ? `${cfg.minYear}-01-01` : iso(new Date(Date.now()-365*864e5));
  const providers = {};
  await Promise.all(["movie","tv"].map(async type=>{
    providers[type] = (await tmdbGet(`/watch/providers/${type}`, { watch_region:"SE" })).results || [];
  }));
  const jobs = [];
  for (const svc of services) for (const type of ["movie","tv"]){
    const ids = providers[type].filter(p=>svc.match.test((p.provider_name||"").trim())).map(p=>p.provider_id);
    if (!ids.length) continue;
    const df = type==="movie" ? "primary_release_date" : "first_air_date";
    for (let page=1; page<=TMDB_PAGES; page++)
      jobs.push(tmdbGet(`/discover/${type}`, {
          watch_region:"SE", language:"sv-SE", with_watch_providers:ids.join("|"),
          with_watch_monetization_types:"flatrate", sort_by:df+".desc",
          [df+".gte"]:from, [df+".lte"]:today, include_adult:"false", page })
        .then(r=>({ svc, type, list:r.results||[] })).catch(()=>({ svc, type, list:[] })));
  }
  for (const { svc, type, list } of await Promise.all(jobs)){
    for (const x of list){
      const tmdbId = type+"/"+x.id, date = x.release_date || x.first_air_date;
      if (!date) continue;
      const ts = Math.floor(new Date(date).getTime()/1000);
      const link = `https://www.themoviedb.org/${tmdbId}/watch?locale=SE`;
      // Discover-svaret har redan språk, land (serier) och svensk beskrivning – spara direkt
      // så att vi slipper en extra TMDB-fråga per titel.
      if (!meta[tmdbId] && x.original_language)
        meta[tmdbId] = { lang:x.original_language, countries:x.origin_country||[], sv:x.overview||null };
      const existing = [...state.shows.values()].find(it=>it.show.tmdbId===tmdbId);
      const it = existing || { show:{
          showType: type==="movie" ? "movie" : "series", tmdbId, title: x.title || x.name,
          overview: x.overview, releaseYear: type==="movie" ? +date.slice(0,4) : undefined,
          firstAirYear: type==="tv" ? +date.slice(0,4) : undefined,
          rating: x.vote_count >= 5 ? Math.round(x.vote_average*10) : 0,
          imageSet:{ verticalPoster:x.poster_path?{ w360:"https://image.tmdb.org/t/p/w342"+x.poster_path }:undefined,
                     horizontalBackdrop:x.backdrop_path?{ w720:"https://image.tmdb.org/t/p/w780"+x.backdrop_path }:undefined } },
        added:{}, links:{} };
      if (!it.added[svc.key] || ts > it.added[svc.key]) it.added[svc.key] = ts;
      it.links[svc.key] = it.links[svc.key] || link;
      it.approx = Object.assign(it.approx||{}, { [svc.key]:true });
      if (!existing) state.shows.set("tmdb:"+tmdbId, it);
    }
  }
  store.set("meta",meta);
}

// ---------- TMDB: ursprungsland, originalspråk och svensk beskrivning ----------
async function tmdbDetails(tmdbId){
  const url = new URL("https://api.themoviedb.org/3/"+tmdbId);   // t.ex. "movie/27205" eller "tv/1399"
  url.searchParams.set("language","sv-SE");
  const headers = { accept:"application/json" }, k = cfg.tmdbKey.trim();
  if (k.length > 40) headers.Authorization = "Bearer "+k; else url.searchParams.set("api_key",k);
  const r = await fetch(url,{ headers });
  if (r.status === 404) return { lang:null, countries:[], sv:null };
  if (!r.ok) throw new Error("TMDB "+r.status);
  const j = await r.json();
  const countries = [...new Set([...(j.origin_country||[]), ...((j.production_countries||[]).map(c=>c.iso_3166_1))])];
  return { lang:j.original_language || null, countries, sv:j.overview || null };
}

async function enrich(){
  if (!cfg.tmdbKey) return;
  const todo = [...new Set([...state.shows.values()].map(it=>it.show.tmdbId).filter(id=>id && !meta[id]))];
  for (let i=0; i<todo.length; i+=8){
    await Promise.all(todo.slice(i,i+8).map(id=>tmdbDetails(id).then(m=>{ meta[id]=m; }).catch(()=>{})));
  }
  if (todo.length) store.set("meta",meta);
}

function excludedRegion(show){
  const m = meta[show.tmdbId]; if (!m) return null;
  for (const r of REGIONS){
    if (!cfg.exclude.includes(r.key)) continue;
    if (m.lang && r.langs.includes(m.lang)) return r;
    if (m.countries.length && m.countries.every(c=>r.countries.includes(c))) return r;
  }
  return null;
}

// ---------- hjälpfunktioner ----------
const latest = it => Math.max(0, ...Object.entries(it.added).filter(([k])=>state.svc.has(k)).map(([,v])=>v));
const year = s => s.releaseYear || s.firstAirYear || "";
const poster = s => s.imageSet?.verticalPoster?.w360 || s.imageSet?.verticalPoster?.w240 || "";
const backdrop = s => s.imageSet?.horizontalBackdrop?.w720 || s.imageSet?.horizontalPoster?.w720 || "";
const svcLabel = k => SERVICES.find(s=>s.key===k)?.label || k;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDay = ts => new Date(ts*1000).toLocaleDateString("sv-SE",{ weekday:"long", day:"numeric", month:"long" });
function dayLabel(ts){
  const d = new Date(ts*1000); d.setHours(0,0,0,0);
  const t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((t-d)/864e5);
  return diff===0 ? "Idag" : diff===1 ? "Igår" : fmtDay(ts);
}

// ---------- UI ----------
function render(){
  const listEl = document.getElementById("list"), status = document.getElementById("status");
  let filteredOut = 0;
  const items = [...state.shows.entries()].filter(([id,it]) => {
      if (state.type!=="all" && it.show.showType!==state.type) return false;
      if (!Object.keys(it.added).some(k=>state.svc.has(k))) return false;
      if (!state.showHidden && hidden.has(id)) return false;
      if (cfg.yearOn && +year(it.show) && +year(it.show) < cfg.minYear) return false;
      if (excludedRegion(it.show)){ filteredOut++; return false; }
      return true; })
    .sort((a,b)=>latest(b[1])-latest(a[1]));
  status.style.display = items.length ? "none" : "";
  if (!items.length) status.textContent = "Inget nytt med de här filtren.";
  const note = document.getElementById("filterNote");
  note.textContent = !cfg.tmdbKey && cfg.exclude.length
    ? "Lägg in en TMDB-nyckel under ⚙︎ för att kunna filtrera på ursprungsland."
    : filteredOut ? `${filteredOut} titlar bortfiltrerade på ursprungsland` : "";
  listEl.innerHTML = "";
  let curLabel = null, grid = null;
  for (const [id,it] of items){
    const lbl = dayLabel(latest(it));
    if (lbl !== curLabel){
      curLabel = lbl;
      const h = document.createElement("h3"); h.textContent = lbl; listEl.appendChild(h);
      grid = document.createElement("div"); grid.className="grid"; listEl.appendChild(grid);
    }
    const s = it.show, b = document.createElement("button"); b.className="item";
    const p = poster(s);
    b.innerHTML = `${p ? `<img loading="lazy" alt="" src="${esc(p)}">` : `<div class="ph">${esc(s.title)}</div>`}
      <div class="t">${esc(s.title)}</div>
      <div class="m">${s.showType==="series"?"Serie":"Film"}${year(s)?" · "+year(s):""}${s.rating?` · ★ ${(s.rating/10).toFixed(1)}`:""}</div>
      <div class="badges">${Object.keys(it.added).map(k=>`<span class="b ${k}">${svcLabel(k)}</span>`).join("")}</div>`;
    b.onclick = ()=>openDetail(id,it);
    grid.appendChild(b);
  }
  document.getElementById("btnMore").style.display = state.hasMore ? "" : "none";
  showUsage();
}

// Extra info till detaljvyn: svensk beskrivning, skådespelare, regissör/skapare och trailer.
// Hämtas från TMDB när man öppnar en titel (ett anrop) och sparas för sessionen.
const extrasCache = {};
async function loadExtras(s){
  if (!cfg.tmdbKey || !s.tmdbId) return null;
  if (extrasCache[s.tmdbId]) return extrasCache[s.tmdbId];
  try{
    const j = await tmdbGet("/"+s.tmdbId, { language:"sv-SE", append_to_response:"credits,videos",
                                           include_video_language:"sv,en,null" });
    const cast = (j.credits?.cast || []).slice(0,8).map(c=>({ name:c.name, role:c.character }));
    const makers = s.tmdbId.startsWith("movie/")
      ? (j.credits?.crew || []).filter(c=>c.job==="Director").map(c=>c.name)
      : (j.created_by || []).map(c=>c.name);
    const vids = (j.videos?.results || []).filter(v=>v.site==="YouTube" && v.key);
    const score = v => (v.type==="Trailer"?4:v.type==="Teaser"?2:0) + (v.official?1:0) + (v.iso_639_1==="sv"?0.5:0);
    const best = vids.sort((a,b)=>score(b)-score(a))[0];
    const ex = { sv:j.overview || null, cast, makers,
                 trailer: best && (best.type==="Trailer" || best.type==="Teaser") ? "https://www.youtube.com/watch?v="+best.key : null };
    extrasCache[s.tmdbId] = ex;
    return ex;
  }catch{ return null; }
}

function openDetail(id,it){
  const s = it.show, isHidden = hidden.has(id), bd = backdrop(s);
  const approx = it.approx || {};
  const buttons = Object.keys(it.added).map(k=> it.links[k]
    ? `<a class="${k}" href="${esc(it.links[k])}" target="_blank" rel="noopener">${approx[k] ? `Hitta på ${svcLabel(k)}` : `▶ Öppna i ${svcLabel(k)}`}</a>` : "").join("");
  const addedTxt = Object.entries(it.added).map(([k,ts])=>`${svcLabel(k)} ${new Date(ts*1000).toLocaleDateString("sv-SE",{day:"numeric",month:"short"})}${approx[k]?" (premiär)":""}`).join(" · ");
  const extra = s.showType==="series" ? (s.seasonCount?` · ${s.seasonCount} säsonger`:"") : (s.runtime?` · ${s.runtime} min`:"");
  document.getElementById("detailBody").innerHTML = `
    ${bd ? `<img class="hero" alt="" src="${esc(bd)}">` : ""}
    <div class="pad">
      <h2>${esc(s.title)}</h2>
      <div class="m">${s.showType==="series"?"Serie":"Film"}${year(s)?" · "+year(s):""}${extra}${s.rating?` · ★ ${(s.rating/10).toFixed(1)}`:""}</div>
      <div class="m">Ny på ${esc(addedTxt)}</div>
      <p id="overview">${esc((meta[s.tmdbId]?.sv) || s.overview || "")}</p>
      <div id="people" class="m">${s.cast?.length ? "Med: "+esc(s.cast.slice(0,6).join(", ")) : ""}</div>
      <div class="actions">
        <span id="trailerSlot" style="display:contents"></span>
        ${tvButtons(it)}
        ${buttons}
        <a href="#" id="toggleHide">${isHidden?"Visa igen":"Dölj (sedd / ointressant)"}</a>
        <a href="#" id="closeDetail">Stäng</a>
      </div>
      <p class="tip">Titeln öppnas i tjänstens app. Tryck sedan på casta-ikonen för att spela på TV:n.${
        Object.keys(approx).length ? " Datum märkta (premiär) kommer från TMDB och visar premiären, inte när titeln lades upp. Länken går då via en sida där du väljer tjänsten." : ""}</p>
    </div>`;
  document.getElementById("detail").classList.add("open");
  document.getElementById("closeDetail").onclick = e=>{ e.preventDefault(); closeSheets(); };
  document.getElementById("toggleHide").onclick = e=>{ e.preventDefault();
    isHidden ? hidden.delete(id) : hidden.add(id); store.set("hidden",[...hidden]); closeSheets(); render(); };
  loadExtras(s).then(ex=>{
    if (!ex || !document.getElementById("detail").classList.contains("open")) return;
    if (ex.sv) $("overview").textContent = ex.sv;
    const ppl = [];
    if (ex.makers.length) ppl.push(`<div><b>${s.showType==="series"?"Skapad av":"Regi"}:</b> ${esc(ex.makers.join(", "))}</div>`);
    if (ex.cast.length) ppl.push(`<div><b>Skådespelare:</b> ${ex.cast.map(c=>esc(c.name)+(c.role?` <span style="opacity:.7">(${esc(c.role)})</span>`:"")).join(", ")}</div>`);
    if (ppl.length) $("people").innerHTML = ppl.join("");
    if (ex.trailer) $("trailerSlot").innerHTML = `<a class="trailer" href="${esc(ex.trailer)}" target="_blank" rel="noopener">🎬 Se trailer</a>`;
  });
}

// ---------- Google TV (bara i Android-appen, via window.TvBridge) ----------
const TV = window.TvBridge || null;
const tvCbs = {};
window.__tvCb = (id, ok, data) => { const f = tvCbs[id]; delete tvCbs[id]; f && f(ok, data); };
window.__tvBack = () => { const open = document.querySelector(".sheet.open"); if (open){ closeSheets(); return true; } return false; };
function tvCall(method, ...args){
  return new Promise((res, rej) => {
    const id = "c" + Math.random().toString(36).slice(2);
    tvCbs[id] = (ok, d) => ok ? res(d) : rej(new Error(d));
    TV[method](...args, id);
  });
}
const tvInfo = () => { try{ return JSON.parse(TV.getTv()); }catch{ return {}; } };
// Startlänkar för tjänstens app när vi inte har en direktlänk (TMDB-läget).
const APP_HOME = { netflix:"https://www.netflix.com/title", prime:"https://app.primevideo.com",
  hbo:"https://play.hbomax.com", disney:"https://www.disneyplus.com", apple:"https://tv.apple.com",
  skyshowtime:"https://www.skyshowtime.com", viaplay:"https://viaplay.se" };

function toast(msg){
  let t = $("toast");
  if (!t){ t = document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove("show"), 3500);
}

function tvButtons(it){
  if (!TV || !tvInfo().paired) return "";
  const approx = it.approx || {}, several = Object.keys(it.added).length > 1;
  return Object.keys(it.added).map(k => {
    // Direktlänk finns (RapidAPI-läget), eller kan slås upp vid klick om RapidAPI-nyckel finns.
    const canPlay = (!approx[k] && it.links[k]) || (cfg.saKey && it.show.tmdbId);
    if (!canPlay && !APP_HOME[k]) return "";
    const label = canPlay ? "📺 Spela på TV" + (several ? " ("+svcLabel(k)+")" : "") : "📺 Öppna "+svcLabel(k)+" på TV";
    return `<a href="#" class="tv" data-svc="${k}" data-tmdb="${esc(it.show.tmdbId||"")}"
      data-url="${esc(!approx[k] && it.links[k] ? it.links[k] : "")}">${label}</a>`;
  }).join("");
}

// Netflix-appen på TV:n öppnar bara rätt titel om länken slutar med ?source=30,
// annars öppnas appen och visar det man såg senast.
function tvLink(svc, url){
  if (svc === "netflix"){
    const id = (url.match(/netflix\.com\/(?:[a-z-]+\/)?(?:title|watch)\/(\d+)/) || [])[1];
    if (id) return `https://www.netflix.com/title/${id}?source=30`;
  }
  return url;
}

// I TMDB-läget saknas direktlänk. Slå då upp just den titeln i Streaming Availability
// (ett anrop, bara när man trycker) och spara svaret.
async function lookupDirectLink(svc, tmdbId){
  const cache = store.get("deeplinks", {}), key = svc+"|"+tmdbId;
  if (cache[key]) return cache[key];
  const show = await sa("/shows/"+tmdbId, { country: COUNTRY });
  const opt = (show.streamingOptions?.[COUNTRY] || [])
    .find(o => o.service?.id === svc && o.type !== "rent" && o.type !== "buy");
  const link = opt?.videoLink || opt?.link || null;
  if (link){ cache[key] = link; store.set("deeplinks", cache); }
  showUsage();
  return link;
}

document.addEventListener("click", async e => {
  const a = e.target.closest("a.tv"); if (!a) return;
  e.preventDefault();
  const svc = a.dataset.svc;
  let url = a.dataset.url;
  try{
    if (!url && cfg.saKey && a.dataset.tmdb){
      toast("Hämtar länk…");
      url = await lookupDirectLink(svc, a.dataset.tmdb).catch(()=>null);
      if (!url) toast(`Hittade ingen direktlänk – öppnar ${svcLabel(svc)} i stället`);
    }
    url = url ? tvLink(svc, url) : APP_HOME[svc];
    if (!url) return toast("Ingen länk att skicka för den här tjänsten.");
    toast("Skickar till TV:n…");
    await tvCall("launch", url);
    toast("Öppnas på TV:n 📺");
  }catch(err){ toast(err.message); }
});

function renderTvSection(){
  const el = $("tvSection"); if (!el || !TV) return;
  const info = tvInfo();
  el.innerHTML = `
    <label>Google TV</label>
    <p class="tip" style="margin-top:0">${info.paired ? `Parkopplad med <b>${esc(info.name||info.host)}</b> (${esc(info.host)}).` : info.host ? `Vald: ${esc(info.name||info.host)} – inte parkopplad än.` : "Ingen TV vald."}</p>
    <div class="actions" style="margin-top:6px">
      <a href="#" id="tvFind">🔍 Sök efter TV på wifi</a>
    </div>
    <div id="tvFound"></div>
    <label for="tvIp">…eller ange TV:ns IP-adress</label>
    <div class="row"><input id="tvIp" inputmode="decimal" placeholder="t.ex. 192.168.1.50"><button id="tvIpGo">Välj</button></div>
    <div id="tvPair"></div>`;
  $("tvFind").onclick = e => { e.preventDefault();
    $("tvFound").innerHTML = `<p class="tip">Söker…</p>`;
    tvCall("discover").then(json => {
      const list = JSON.parse(json);
      $("tvFound").innerHTML = list.length
        ? `<div class="actions">${list.map(t=>`<a href="#" data-host="${esc(t.host)}" data-name="${esc(t.name)}">📺 ${esc(t.name)}</a>`).join("")}</div>`
        : `<p class="tip">Hittade ingen TV. Kontrollera att den är påslagen och på samma wifi, eller ange IP-adressen.</p>`;
      $("tvFound").querySelectorAll("a[data-host]").forEach(a => a.onclick = ev => { ev.preventDefault(); pair(a.dataset.host, a.dataset.name); });
    }).catch(err => $("tvFound").innerHTML = `<p class="tip">${esc(err.message)}</p>`);
  };
  $("tvIpGo").onclick = () => { const ip = $("tvIp").value.trim(); if (ip) pair(ip, ip); };
}

function pair(host, name){
  $("tvPair").innerHTML = `<p class="tip">Ansluter till ${esc(name)}…</p>`;
  tvCall("startPairing", host, name).then(() => {
    $("tvPair").innerHTML = `
      <label for="tvCode">Skriv koden som visas på TV:n</label>
      <div class="row"><input id="tvCode" autocapitalize="characters" maxlength="6" placeholder="6 tecken"><button id="tvCodeGo">Klar</button></div>`;
    $("tvCode").focus();
    $("tvCodeGo").onclick = () => {
      $("tvCodeGo").disabled = true;
      tvCall("finishPairing", $("tvCode").value).then(() => {
        toast("Parkopplad med TV:n ✓"); renderTvSection();
      }).catch(err => { $("tvCodeGo").disabled = false; toast(err.message); });
    };
  }).catch(err => $("tvPair").innerHTML = `<p class="tip">${esc(err.message)}</p>`);
}

function closeSheets(){ document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("open")); }
document.querySelectorAll(".sheet").forEach(s=>s.addEventListener("click",e=>{ if(e.target===s) closeSheets(); }));

// filter
document.querySelectorAll("#typeChips [data-type]").forEach(b=>b.onclick=()=>{
  state.type=b.dataset.type;
  document.querySelectorAll("#typeChips [data-type]").forEach(x=>x.classList.toggle("on",x===b)); render(); });
document.getElementById("btnHidden").onclick = e=>{ state.showHidden=!state.showHidden; e.target.classList.toggle("on",state.showHidden); render(); };
document.getElementById("btnRefresh").onclick = ()=>load(true);
function updateYearBtn(){
  const b = document.getElementById("btnYear");
  b.textContent = `Från ${cfg.minYear}`; b.classList.toggle("on", cfg.yearOn);
}
document.getElementById("btnYear").onclick = ()=>{ cfg.yearOn = !cfg.yearOn; store.set("cfg2",cfg); updateYearBtn();
  cfg.source==="tmdb" ? load() : render(); };  // i TMDB-läget styr året vad som hämtas
updateYearBtn();
document.getElementById("btnMore").onclick = ()=>load(false,true);

// inställningar
const $ = id => document.getElementById(id);
$("btnSettings").onclick = ()=>{
  $("source").value=cfg.source; $("saKey").value=cfg.saKey; $("saSource").value=cfg.saSource; $("tmdbKey").value=cfg.tmdbKey; $("minYear").value=cfg.minYear;
  $("serviceBoxes").innerHTML = SERVICES.map(s=>`<label class="chk"><input type="checkbox" value="${s.key}" ${cfg.services.includes(s.key)?"checked":""}> ${s.label}</label>`).join("");
  $("regionBoxes").innerHTML = REGIONS.map(r=>`<label class="chk"><input type="checkbox" value="${r.key}" ${cfg.exclude.includes(r.key)?"checked":""}> ${r.label}</label>`).join("");
  renderTvSection();
  $("settings").classList.add("open"); };
$("closeSettings").onclick = e=>{ e.preventDefault(); closeSheets(); };
$("saveSettings").onclick = e=>{ e.preventDefault();
  const prev = cfg;
  cfg = { saKey:$("saKey").value.trim(), saSource:$("saSource").value, tmdbKey:$("tmdbKey").value.trim(),
          exclude:[...document.querySelectorAll("#regionBoxes input:checked")].map(x=>x.value),
          services:[...document.querySelectorAll("#serviceBoxes input:checked")].map(x=>x.value),
          minYear: +$("minYear").value || prev.minYear, yearOn: prev.yearOn, source: $("source").value };
  store.set("cfg2",cfg); state.svc = new Set(cfg.services); closeSheets(); updateYearBtn();
  // Ladda om från API:t bara om nycklarna ändrats – annars räcker cachen (sparar anrop).
  load(prev.saKey!==cfg.saKey || prev.saSource!==cfg.saSource || (cfg.source==="tmdb" && prev.tmdbKey!==cfg.tmdbKey)); };

load();
</script>
